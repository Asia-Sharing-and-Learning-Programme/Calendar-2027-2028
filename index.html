function wkLabel(k){var p=k.split('-').map(Number);var off=(new Date(p[0],p[1]-1,1).getDay()+6)%7;return 'Week '+(Math.floor((off+p[2]-1)/7)+1)+' of '+MONTHS[p[1]-1]}
function nt(){var v=(document.getElementById('f-notes')||{}).value;return v&&v.trim()?v.trim():undefined}
function getLinks(c){var a=[];Array.prototype.forEach.call(document.querySelectorAll('#f-links input:checked'),function(x){if(x.value!==c)a.push(x.value)});return a.length?a:undefined}

/* ---------- countries / territories ---------- */
function tName(l){return l.split(' · ').slice(1).join(' · ')||l}
function clName(l){return l.split(' · ')[0]}
function inList(n){return COUNTRIES.some(function(g){return g[1].indexOf(n)>=0})}
function inTerr(n){return COUNTRIES.some(function(g){return tName(g[0])===n})}
function fromArr(v){return !v?[]:(Array.isArray(v)?v:[v])}
function routeTxt(e){var a=fromArr(e.from).join(', ');return (a||e.to)?(a||'?')+' → '+(e.to||'?'):''}
function aslfTxt(e){var p=[];if(e.host)p.push('Host: '+e.host);if(e.country)p.push('Country: '+e.country);return p.join(' · ')}
function groupedOpts(sel,ph){var s='<option value="">'+ph+'</option>';COUNTRIES.forEach(function(g){s+='<optgroup label="'+esc(g[0])+'">';g[1].forEach(function(n){s+='<option'+(n===sel?' selected':'')+'>'+esc(n)+'</option>'});s+='</optgroup>'});return s}
function terrOpts(sel){var cls={},order=[];COUNTRIES.forEach(function(g){var c=clName(g[0]),t=tName(g[0]);if(!cls[c]){cls[c]=[];order.push(c)}if(cls[c].indexOf(t)<0)cls[c].push(t)});var s='<option value="">— Select territory —</option>';order.forEach(function(c){s+='<optgroup label="'+esc(c)+'">';cls[c].forEach(function(t){s+='<option'+(t===sel?' selected':'')+'>'+esc(t)+'</option>'});s+='</optgroup>'});return s}
function countryOpts(host,sel){var gs=COUNTRIES.filter(function(g){return host&&tName(g[0])===host});if(!gs.length)gs=COUNTRIES;var all=[];gs.forEach(function(g){g[1].forEach(function(n){if(all.indexOf(n)<0)all.push(n)})});all.sort(function(a,b){return a.toLowerCase()<b.toLowerCase()?-1:1});var s='<option value="">— Select country —</option>';all.forEach(function(n){s+='<option'+(n===sel?' selected':'')+'>'+esc(n)+'</option>'});return s}
function p2pRow(f){var show=['p2p','capdev'].indexOf(f.cat)>=0||(f.links||[]).some(function(x){return x==='p2p'||x==='capdev'});var fsel=fromArr(f.from),fl='';COUNTRIES.forEach(function(g){fl+='<div class="lkh">'+esc(g[0])+'</div>';g[1].forEach(function(n){fl+='<label class="lkc"><input type="checkbox" value="'+esc(n)+'"'+(fsel.indexOf(n)>=0?' checked':'')+'>'+esc(n)+'</label>'})});
  return '<div id="f-p2p" class="two" style="display:'+(show?'grid':'none')+';align-items:start"><div><label>From (tick one or more countries) <button type="button" class="lnk" id="f-from-clear">Clear all</button></label><div id="f-from" class="lks" style="grid-template-columns:1fr;max-height:170px">'+fl+'</div><input id="f-from-other" style="margin-top:6px" placeholder="Others: type here (separate with commas)" value="'+esc(fsel.filter(function(n){return !inList(n)}).join(', '))+'"></div><div><label>To (country)</label><select id="f-to">'+groupedOpts(f.to,'— Select country —')+'</select><input id="f-to-other" style="margin-top:6px" placeholder="Others: type here if not in the list" value="'+esc(f.to&&!inList(f.to)?f.to:'')+'"></div></div>'}
function route(){var w=document.getElementById('f-p2p');if(!w||w.style.display==='none')return {};var a=Array.prototype.map.call(document.querySelectorAll('#f-from input:checked'),function(x){return x.value}),b=document.getElementById('f-to').value;var fo=(document.getElementById('f-from-other')||{}).value||'',to2=((document.getElementById('f-to-other')||{}).value||'').trim();fo.split(',').forEach(function(x){x=x.trim();if(x&&a.indexOf(x)<0)a.push(x)});if(to2)b=to2;return {from:a.length?a:undefined,to:b||undefined}}
function aslfRow(f){var show=f.cat==='aslf'||(f.links||[]).indexOf('aslf')>=0;return '<div id="f-aslf" class="two" style="display:'+(show?'grid':'none')+';align-items:start"><div><label>Host territory</label><select id="f-host">'+terrOpts(f.host)+'</select><input id="f-host-other" style="margin-top:6px" placeholder="Others: type here if not in the list" value="'+esc(f.host&&!inTerr(f.host)?f.host:'')+'"></div><div><label>Country</label><select id="f-country">'+countryOpts(f.host,f.country)+'</select><input id="f-country-other" style="margin-top:6px" placeholder="Others: type here if not in the list" value="'+esc(f.country&&!inList(f.country)?f.country:'')+'"></div></div>'}
function aslfVal(){var w=document.getElementById('f-aslf');if(!w||w.style.display==='none')return {};function v(id){var o=((document.getElementById(id+'-other')||{}).value||'').trim();return o||document.getElementById(id).value||undefined}return {host:v('f-host'),country:v('f-country')}}

  h+='<div class="two"><div><label>Repeat</label><select id="f-rep">'+(editId?'<option value="keep">'+(f.grp?'Keep current repeat':'Keep as is (does not repeat)')+'</option>':'')+'<option value="">'+(editId&&f.grp?'Stop repeating (remove later dates)':'Does not repeat')+'</option><option value="w1">Every week</option><option value="w2">Every 2 weeks</option><option value="m1">Every month (same date)</option><option value="mn">Every month (same weekday, e.g. 2nd Tue)</option><option value="m2">Every 2 months</option><option value="m3">Every 3 months</option><option value="m6">Every 6 months</option><option value="y1">Every year</option></select></div><div><label>Until</label><input type="date" id="f-until" min="2027-01-01" max="2028-12-31" value="2028-12-31"></div></div><label class="chk"><input type="checkbox" id="f-wd" checked>Keep repeats on work days (Mon–Fri): Saturday and Sunday move to the Monday after</label>'+(editId&&f.grp?'<div class="sub" style="margin-top:6px">Changing the repeat replaces this date and all later dates in this series. Earlier dates stay as they are.</div>':'');

function closeModal(){document.getElementById('ov').classList.remove('on');curKey=null;editId=null}
function save(){
  var t=document.getElementById('f-title').value.trim(),c=document.getElementById('f-cat').value,s=document.getElementById('f-start').value,e=document.getElementById('f-end').value||s,err=document.getElementById('f-err');
  if(!t){err.textContent='Give the entry a name.';return}
  if(!/^202[78]-\d\d-\d\d$/.test(s)||!/^202[78]-\d\d-\d\d$/.test(e)){err.textContent='Dates need to be between Jan 2027 and Dec 2028.';return}
  if(e<s){err.textContent='"To" date is before "From" date.';return}
  var repEl=document.getElementById('f-rep'),repV=repEl?repEl.value:'keep';
  var n=nt(),L=getLinks(c),R=route(),AS=aslfVal();
  if(editId&&repV==='keep'){
    var cur=state.events.filter(function(x){return x.id===editId})[0],all=!!(cur&&cur.grp&&(document.getElementById('f-all')||{}).checked);
    state.events=state.events.map(function(x){
      if(x.id===editId)return {id:x.id,grp:x.grp,title:t,cat:c,start:s,end:e,notes:n,links:L,from:R.from,to:R.to,host:AS.host,country:AS.country};
      if(all&&x.grp===cur.grp)return {id:x.id,grp:x.grp,title:t,cat:c,start:x.start,end:x.end,notes:n,links:L,from:R.from,to:R.to,host:AS.host,country:AS.country};
      return x});
  }else{
    var rep=repV==='keep'?'':repV,until=(document.getElementById('f-until')||{}).value||'2028-12-31';
    if(until>'2028-12-31')until='2028-12-31';
    if(rep&&until<s){err.textContent='"Until" date is before the start date.';return}
    if(editId){var cur0=state.events.filter(function(x){return x.id===editId})[0];if(cur0){var g0=cur0.grp;state.events=state.events.filter(function(x){return !(x.id===editId||(g0&&x.grp===g0&&x.start>=cur0.start))})}}
    var starts=rep?occurrences(s,rep,until):[s];if(rep&&(document.getElementById('f-wd')||{}).checked)starts=starts.map(workday);
    var dur=daysBetween(s,e),grp=starts.length>1?uid():undefined;
    starts.forEach(function(st){var en=addDays(st,dur);if(en>'2028-12-31')en='2028-12-31';state.events.push({id:uid(),grp:grp,title:t,cat:c,start:st,end:en,notes:n,links:L,from:R.from,to:R.to,host:AS.host,country:AS.country})});
  }
  closeModal();persist();
}

/* ---------- saving ---------- */
function download(name,text,type){var b=new Blob([text],{type:type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},500)}
function clean(e){var o={};for(var k in e)if(e[k]!==undefined&&e[k]!==null&&e[k]!==''&&!(Array.isArray(e[k])&&!e[k].length))o[k]=e[k];return o}
function sig(e){return JSON.stringify(clean(e),Object.keys(clean(e)).sort())}
function errText(e){var m=(e&&(e.message||e.error_description))||String(e||'');return m.replace(/^.*Not allowed:\s*/,'')}
/* load all entries from the shared database */
function load(quiet){
  if(!quiet)setStatus('Loading…');
  var pub=!me.can_view;
  return sb.rpc(pub?'cal_public':'cal_get').then(function(r){
    if(r.error)throw r.error;
    var d=r.data||{};applySettings(pub?{types:d.types||[],isPublic:true}:(d.settings||{}));var evs=(d.events||[]).map(clean);
    state={events:evs};synced={};evs.forEach(function(e){synced[e.id]=sig(e)});loaded=true;
    if(!quiet&&!saving)setStatus('Up to date');
    if(!document.getElementById('ov').classList.contains('on'))render();
  }).catch(function(e){loaded=true;setStatus('Could not load the calendar: '+errText(e));render()});
}
/* send only what changed since the last load */
function persist(){
  render();
  if(!me.can_edit){setStatus('Sign in to save changes');return}
  var up=[],cur={};
  state.events.forEach(function(e){cur[e.id]=1;var s=sig(e);if(synced[e.id]!==s)up.push(clean(e))});
  var del=Object.keys(synced).filter(function(id){return !cur[id]});
  if(!up.length&&!del.length)return;
  saving=true;setStatus('Saving…');
  sb.rpc('cal_save',{p_upserts:up,p_deletes:del}).then(function(r){
    saving=false;if(r.error)throw r.error;
    up.forEach(function(e){synced[e.id]=sig(e)});del.forEach(function(id){delete synced[id]});
    setStatus('All changes saved');load(true);
  }).catch(function(e){saving=false;setStatus('Not saved: '+errText(e));load(true)});
}
/* who is signed in */
function refreshMe(){
  return sb.rpc('cal_whoami').then(function(r){var d=(r&&r.data)||{};me={email:d.email||'',role:d.role||'',can_view:!!d.can_view,can_edit:!!d.can_edit,is_admin:!!d.is_admin,group_names:d.group_names||[]};return load()}).catch(function(){me={email:'',can_view:false,can_edit:false,is_admin:false,group_names:[]};return load()});
}
function hhmm(iso){try{return new Date(iso).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}

  var used=st.used||0,lim=st.limit||2,left=Math.max(0,lim-used);

  h+='<p>'+(left?left+' sign-in email'+(left===1?'':'s')+' left this hour, shared by everyone signing in to the calendar.':'The limit is reached. The next sign-in email can be sent at about <b>'+esc(hhmm(st.next_free_at))+'</b>.')+'</p>';
  h+='<p class="lb-note">Each link works once and expires after 1 hour — check your spam folder before asking for another. Once signed in, you stay signed in on this device.</p></div>';

}
var signinStatus=null;
function openSignin(){
  curKey=null;editId=null;
  document.getElementById('modal').innerHTML='<h3>Sign in</h3><div class="signin"><p>Enter the email your ASLP admin registered for you. We\'ll email you a sign-in link — open it on this device.</p></div><div id="si-limit"><div class="lb-note">Checking the sign-in limit…</div></div><input id="si-email" type="email" placeholder="name@salvationarmy.org" autocomplete="email"><div class="err" id="si-err"></div><div class="btns"><button class="b" id="f-cancel">Close</button><button class="b signin-btn" id="si-go">Send sign-in link</button></div>';
  document.getElementById('ov').classList.add('on');
  setTimeout(function(){var i=document.getElementById('si-email');if(i)i.focus()},30);
  sb.rpc('cal_signin_status').then(function(r){if(r.error)throw r.error;signinStatus=r.data||{};var b=document.getElementById('si-limit');if(b)b.innerHTML=limitBox(signinStatus);var go=document.getElementById('si-go');if(go&&signinStatus.used>=signinStatus.limit)go.disabled=true}).catch(function(){var b=document.getElementById('si-limit');if(b)b.innerHTML=''});
}
function sendLink(){
  var em=(document.getElementById('si-email').value||'').trim().toLowerCase(),err=document.getElementById('si-err'),go=document.getElementById('si-go');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){err.textContent='Enter a valid email address.';return}
  go.disabled=true;err.textContent='';
  sb.rpc('cal_request_signin',{p_email:em}).then(function(r){
    if(r.error)throw r.error;var d=r.data||{};
    if(d.limit!=null){var b=document.getElementById('si-limit');if(b)b.innerHTML=limitBox(d)}
    if(!d.ok){
      if(d.reason==='not_registered'){go.disabled=false;err.textContent='This email is not registered for the ASLP calendar. Ask an ASLP admin to add it.';return}
      err.textContent='The hourly sign-in limit is reached. Please try again at about '+hhmm(d.next_free_at)+'.';return;
    }
    return sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+location.pathname}}).then(function(r2){
      if(r2.error)throw r2.error;
      document.getElementById('modal').innerHTML='<h3>Check your email</h3><div class="signin"><p>We sent a sign-in link to <b>'+esc(em)+'</b>. Open it on this device to see the calendar with your access.</p></div>'+limitBox(d)+'<div class="btns"><button class="b p" id="f-cancel">OK</button></div>';
    });
  }).catch(function(e){go.disabled=false;var m=errText(e);err.textContent=/rate limit|too many/i.test(m)?'Too many sign-in emails were sent in the last hour (this limit is shared with the CD Strategy dashboard). Please try again later.':'Could not send the link: '+m});
}


/* ---------- admin ---------- */

function openAdmin(){document.getElementById('adm').classList.add('on');document.getElementById('adm').innerHTML='<div class="adm"><div class="loading">Loading admin settings…</div></div>';
  sb.rpc('cal_admin_get').then(function(r){if(r.error)throw r.error;var d=r.data||{};
    applySettings(d.settings||{});
    adm={users:(d.users||[]).map(function(u){return {email:u.email,role:u.role,grp:u.grp||''}}),auto:d.auto||[],log:d.log||[],
      types:typesFromCurrent(),groups:JSON.parse(JSON.stringify(LEADGROUPS)),terr:COUNTRIES.map(function(g){return {cl:clName(g[0]),t:tName(g[0]),c:g[1].join(', ')}})};
    admMsg='';renderAdmin();loadSignins()}).catch(function(e){document.getElementById('adm').innerHTML='<div class="adm"><p class="msg bad">Could not open admin: '+esc(errText(e))+'</p><button class="b" data-a="close">Close</button></div>'})}
function closeAdmin(){document.getElementById('adm').classList.remove('on');render()}
function roleSel(v){return '<select data-f="role">'+[['member','Group member – sees full details for their group'],['lead','Group lead – as members, plus hidden types if their group allows'],['admin','Admin – sees everything and can change it']].map(function(r){return '<option value="'+r[0]+'"'+(r[0]===v?' selected':'')+'>'+r[1]+'</option>'}).join('')+'</select>'}
function grpSel(v){return '<select data-f="grp"><option value="">— choose group —</option>'+adm.groups.map(function(g){return '<option value="'+esc(g.key)+'"'+(g.key===v?' selected':'')+'>'+esc(g.name)+'</option>'}).join('')+'</select>'}
function renderAdmin(){

  if(admTab==='access'){
    h+='<p class="note">Anyone can see the public summary (dates and types only). People listed here sign in with an emailed link. <b>Group members</b> see full details for entries of their group (set up in the Groups tab) and a summary of everything else. <b>Group leads</b> see the same, plus the hidden types if their group is allowed. <b>Admins</b> see everything, can add and change entries, and can use this page.</p>';

    h+='</tbody></table><div class="bar"><button class="b" data-a="add-user">+ Add person</button><button class="b p" data-a="save-users">Save access</button></div>';
    h+='<div class="box" style="margin-top:20px"><b style="font-size:13px">Also have access automatically</b><p class="note" style="margin:4px 0 6px">These come from the CD Strategy dashboard\'s admin list and are managed there.</p><table><tbody>'+(adm.auto.length?adm.auto.map(function(a){return '<tr><td>'+esc(a.email)+'</td><td>'+esc(a.role==='admin'?'Admin':a.role==='member'?'Group member':'Group lead')+'</td><td class="msg">'+esc(a.source)+'</td></tr>'}).join(''):'<tr><td class="msg">None</td></tr>')+'</tbody></table></div>';
  }
  if(admTab==='groups'){
    h+='<p class="note">For each group: which entry types its leads see <b>in full</b> (an entry counts if its main type or any linked type is ticked), and whether its <b>leads</b> (not members) can see the <b>hidden types</b> (marked hidden in the Types tab, such as ASLP Phase 2 and Significant Change Process). Everything else shows to them as a summary.</p>';
    h+='<table><thead><tr><th style="width:180px">Group name</th><th>Sees full details of</th><th style="width:120px">Leads see hidden types</th><th></th></tr></thead><tbody id="adm-groups">';
    adm.groups.forEach(function(g,i){h+='<tr data-i="'+i+'"><td><input data-f="name" value="'+esc(g.name)+'"></td><td><div class="lks" style="max-height:110px">'+adm.types.map(function(x){return '<label class="lkc"><input type="checkbox" data-t="'+esc(x.key)+'"'+((g.types||[]).indexOf(x.key)>=0?' checked':'')+'><i class="sw" style="background:'+esc(x.color)+'"></i>'+esc(x.label)+'</label>'}).join('')+'</div></td><td><label class="lkc"><input type="checkbox" data-r="1"'+(g.restricted?' checked':'')+'>Can see</label></td><td><button class="lnk del" data-a="rm-group" data-i="'+i+'">Remove</button></td></tr>'});
    h+='</tbody></table><div class="bar"><button class="b" data-a="add-group">+ Add group</button><button class="b p" data-a="save-groups">Save groups</button></div>';
  }
  if(admTab==='types'){
    h+='<p class="note">The types used for entries: name, colour, which filter row they appear in, and whether they are <b>hidden</b> (left out of the public summary and only shown to admins and groups allowed in the Group leads tab). Removing a type doesn\'t delete entries — they show as <b>Other</b> until you give them a new type.</p>';
    h+='<table><thead><tr><th>Colour</th><th>Name</th><th>Row</th><th>Hidden</th><th></th></tr></thead><tbody id="adm-types">';
    adm.types.forEach(function(x,i){h+='<tr data-i="'+i+'"><td><input data-f="color" type="color" value="'+esc(x.color)+'"></td><td><input data-f="label" value="'+esc(x.label)+'"></td><td><select data-f="group">'+['Groups','Activities','Others'].map(function(g){return '<option'+(g===x.group?' selected':'')+'>'+g+'</option>'}).join('')+'</select></td><td><label class="lkc"><input type="checkbox" data-f="restricted" value="1"'+(x.restricted?' checked':'')+'>Hide</label></td><td>'+(x.key==='other'?'<span class="msg">always kept</span>':'<button class="lnk del" data-a="rm-type" data-i="'+i+'">Remove</button>')+'</td></tr>'});
    h+='</tbody></table><div class="bar"><button class="b" data-a="add-type">+ Add type</button><button class="b p" data-a="save-types">Save types</button></div>';
  }
  if(admTab==='terr'){
    h+='<p class="note">The lists used for P2P visits, Capacity Development and ASLF (host territory and country). One row per territory; separate countries with commas.</p>';
    h+='<table><thead><tr><th style="width:110px">Cluster</th><th>Territory</th><th>Countries</th><th></th></tr></thead><tbody id="adm-terr">';
    adm.terr.forEach(function(x,i){h+='<tr data-i="'+i+'"><td><input data-f="cl" value="'+esc(x.cl)+'" placeholder="SPEA 1"></td><td><input data-f="t" value="'+esc(x.t)+'"></td><td><input data-f="c" value="'+esc(x.c)+'"></td><td><button class="lnk del" data-a="rm-terr" data-i="'+i+'">Remove</button></td></tr>'});
    h+='</tbody></table><div class="bar"><button class="b" data-a="add-terr">+ Add territory</button><button class="b p" data-a="save-terr">Save territories</button></div>';
  }
  if(admTab==='signins'){
    var s=adm.signins;
    if(!s){h+='<p class="note">Loading…</p>'}else{
      var st=s.status||{};
      h+='<p class="note">Sign-in links are sent by email through Supabase. With Supabase\'s built-in email sender the whole project can send only <b>2 sign-in emails per hour</b>, shared with the CD Strategy dashboard. If you connect your own email provider (custom SMTP) in Supabase, raise the limit below to match.</p>';
      h+=limitBox(st);
      h+='<div class="stats"><div class="stat"><b>'+(s.links_today||0)+'</b><span>sign-in emails, last 24 h</span></div><div class="stat"><b>'+(s.signins_today||0)+'</b><span>sign-ins, last 24 h</span></div><div class="stat"><b>'+(s.signins_total||0)+'</b><span>sign-ins in total</span></div><div class="stat"><b>'+(s.people_total||0)+'</b><span>people who have signed in</span></div></div>';
      h+='<div class="bar" style="margin:4px 0 16px"><label style="margin:0;color:var(--ink)">Sign-in emails allowed per hour</label><input id="adm-limit" type="number" min="1" step="1" value="'+(st.limit||2)+'" style="width:90px"><button class="b p" data-a="save-limit">Save limit</button><button class="b" data-a="reload-signins">Refresh</button></div>';
      h+='<table><thead><tr><th style="width:150px">When</th><th>Email</th><th>What</th></tr></thead><tbody>';
      h+=(s.recent||[]).length?s.recent.map(function(x){return '<tr><td>'+esc(new Date(x.at).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}))+'</td><td>'+esc(x.email)+'</td><td>'+(x.kind==='signed_in'?'Signed in':'Sign-in email sent')+'</td></tr>'}).join(''):'<tr><td colspan="3" class="msg">No sign-ins yet.</td></tr>';
      h+='</tbody></table>';
    }
  }
  if(admTab==='log'){
    h+='<p class="note">The latest 300 changes to the calendar and its settings.</p><table><thead><tr><th style="width:150px">When</th><th>Who</th><th>What</th></tr></thead><tbody>';
    h+=adm.log.length?adm.log.map(function(l){var d=new Date(l.at);return '<tr><td>'+esc(d.toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}))+'</td><td>'+esc(l.email)+'</td><td><b>'+esc(l.action)+'</b> '+esc(l.detail)+'</td></tr>'}).join(''):'<tr><td colspan="3" class="msg">No changes recorded yet.</td></tr>';
    h+='</tbody></table><div class="bar"><button class="b" data-a="reload-log">Refresh</button></div>';
  }
  h+='</div>';document.getElementById('adm').innerHTML=h;
}
function loadSignins(){sb.rpc('cal_admin_signins').then(function(r){if(r.error)throw r.error;if(adm){adm.signins=r.data||{};if(admTab==='signins')renderAdmin()}}).catch(function(e){if(adm){adm.signins={recent:[],status:{}};admSay('Could not load sign-ins: '+errText(e),true)}})}
function rows(id){return Array.prototype.map.call(document.querySelectorAll('#'+id+' tr[data-i]'),function(tr){var o={};Array.prototype.forEach.call(tr.querySelectorAll('[data-f]'),function(x){o[x.getAttribute('data-f')]=x.type==='checkbox'?x.checked:x.value.trim()});return o})}
function syncAdm(){if(!adm)return;if(document.getElementById('adm-users'))adm.users=rows('adm-users');if(document.getElementById('adm-types')){var r=rows('adm-types');adm.types=adm.types.map(function(x,i){return {key:x.key,label:r[i]?r[i].label:x.label,color:r[i]?r[i].color:x.color,group:r[i]?r[i].group:x.group,restricted:r[i]?!!r[i].restricted:!!x.restricted}})}
  if(document.getElementById('adm-groups')){adm.groups=Array.prototype.map.call(document.querySelectorAll('#adm-groups tr[data-i]'),function(tr,i){var g=adm.groups[i]||{};return {key:g.key||'',name:tr.querySelector('[data-f=name]').value.trim(),types:Array.prototype.filter.call(tr.querySelectorAll('[data-t]'),function(x){return x.checked}).map(function(x){return x.getAttribute('data-t')}),restricted:tr.querySelector('[data-r]').checked}})}if(document.getElementById('adm-terr'))adm.terr=rows('adm-terr')}
function admSay(m,bad){admMsg=m;admBad=!!bad;var e=document.getElementById('admmsg');if(e){e.textContent=m;e.className='msg'+(bad?' bad':'')}}
function admSave(rpc,args,ok){admSay('Saving…');sb.rpc(rpc,args).then(function(r){if(r.error)throw r.error;admSay(ok);load(true);sb.rpc('cal_admin_get').then(function(r2){if(r2.data)adm.log=r2.data.log||adm.log})}).catch(function(e){admSay('Not saved: '+errText(e),true)})}
function slug(s){return (s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'type').slice(0,24)+'_'+Math.random().toString(36).slice(2,6)}
document.addEventListener('click',function(ev){
  var t=ev.target;if(!t||!t.closest||!t.closest('#adm'))return;var a=t.getAttribute('data-a');if(!a)return;
  if(a==='close'){closeAdmin();return}
  syncAdm();
  var i=+t.getAttribute('data-i');
  if(a==='tab'){admTab=t.getAttribute('data-tab');admMsg='';renderAdmin();return}
  if(a==='add-user'){adm.users.push({email:'',role:'lead',grp:''});renderAdmin();var ins=document.querySelectorAll('#adm-users input');if(ins.length)ins[ins.length-1].focus();return}
  if(a==='rm-user'){adm.users.splice(i,1);renderAdmin();admSay('Removed — click Save access to confirm');return}
  if(a==='save-users'){var us=adm.users.filter(function(u){return u.email});var bad=us.filter(function(u){return !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(u.email)});if(bad.length){admSay('Check this email: '+bad[0].email,true);return}var ng=us.filter(function(u){return u.role!=='admin'&&!u.grp});if(ng.length){admSay('Choose a group for '+ng[0].email,true);return}admSave('cal_admin_set_users',{p_users:us.map(function(u){return {email:u.email.toLowerCase(),role:u.role,grp:u.role!=='admin'?u.grp:''}})},'Access saved');return}
  if(a==='add-type'){adm.types.push({key:'',label:'',color:'#5c6bc0',group:'Activities'});renderAdmin();var ti=document.querySelectorAll('#adm-types input[data-f=label]');if(ti.length)ti[ti.length-1].focus();return}
  if(a==='rm-type'){adm.types.splice(i,1);renderAdmin();admSay('Removed — click Save types to confirm');return}
  if(a==='save-types'){var ty=adm.types.filter(function(x){return x.label});if(!ty.length){admSay('Add at least one type',true);return}ty.forEach(function(x){if(!x.key)x.key=slug(x.label)});adm.types=ty;admSave('cal_admin_set_setting',{p_key:'types',p_value:ty},'Types saved');return}
  if(a==='add-group'){adm.groups.push({key:'',name:'',types:[],restricted:false});renderAdmin();return}
  if(a==='rm-group'){adm.groups.splice(i,1);renderAdmin();admSay('Removed — click Save groups to confirm');return}
  if(a==='save-groups'){var gs=adm.groups.filter(function(g){return g.name});if(!gs.length){admSay('Add at least one group',true);return}gs.forEach(function(g){if(!g.key)g.key=slug(g.name)});adm.groups=gs;LEADGROUPS=gs;admSave('cal_admin_set_setting',{p_key:'lead_groups',p_value:gs},'Groups saved');return}
  if(a==='add-terr'){adm.terr.push({cl:'',t:'',c:''});renderAdmin();return}
  if(a==='rm-terr'){adm.terr.splice(i,1);renderAdmin();admSay('Removed — click Save territories to confirm');return}
  if(a==='save-terr'){var te=adm.terr.filter(function(x){return x.t&&x.c});if(!te.length){admSay('Add at least one territory with countries',true);return}
    var val=te.map(function(x){return [(x.cl?x.cl+' · ':'')+x.t,x.c.split(',').map(function(s){return s.trim()}).filter(Boolean)]});admSave('cal_admin_set_setting',{p_key:'countries',p_value:val},'Territories saved');return}
  if(a==='reload-log'){openAdmin();return}
  if(a==='reload-signins'){adm.signins=null;renderAdmin();loadSignins();return}
  if(a==='save-limit'){var v=parseInt((document.getElementById('adm-limit')||{}).value,10);if(!(v>=1)){admSay('Enter a whole number of at least 1',true);return}admSave('cal_admin_set_setting',{p_key:'signin_limit',p_value:[v]},'Limit saved');setTimeout(loadSignins,800);return}
});
/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var t=ev.target;if(!t)return;
  if(t.id==='darkbtn'){DARK=!DARK;lsSet('aslpDark',DARK?'1':'0');document.documentElement.classList.toggle('dark',DARK);render();return}
  if(t.id==='exportbtn'){download('aslp-calendar-entries.json',JSON.stringify(state,null,1),'application/json');return}
  if(t.hasAttribute&&t.hasAttribute('data-ysel')){YSEL=t.getAttribute('data-ysel');try{localStorage.setItem('aslpYear',YSEL)}catch(e){}render();return}
  if(t.id==='adminbtn'){openAdmin();return}
  if(t.id==='signinbtn'){openSignin();return}
  if(t.id==='si-go'){sendLink();return}
  if(t.id==='signoutbtn'){sb.auth.signOut().then(function(){me={email:'',can_view:false,can_edit:false,is_admin:false,group_names:[]};load()});return}
  if(t.id==='f-from-clear'){ev.preventDefault();Array.prototype.forEach.call(document.querySelectorAll('#f-from input:checked'),function(x){x.checked=false});var fo2=document.getElementById('f-from-other');if(fo2)fo2.value='';return}
  if(t.hasAttribute&&t.hasAttribute('data-fall')){hidden={};if(t.getAttribute('data-fall')==='0')for(var c in CATS)hidden[c]=1;saveF();render();return}
  var cell=t.closest&&t.closest('.c[data-k]');if(cell){openDay(cell.getAttribute('data-k'));return}
  var row=t.closest&&t.closest('[data-open]');if(row){openDay(row.getAttribute('data-open'));return}
  if(t.id==='ov'||t.id==='f-cancel'){closeModal();return}
  if(t.id==='f-save'){save();return}
  if(t.getAttribute('data-edit')){var id=t.getAttribute('data-edit');var e=state.events.filter(function(x){return x.id===id})[0];if(e){editId=id;drawModal(e)}return}
  if(t.getAttribute('data-delgrp')){var g=t.getAttribute('data-delgrp');state.events=state.events.filter(function(x){return x.grp!==g});closeModal();persist();return}
  if(t.getAttribute('data-del')){var id2=t.getAttribute('data-del');state.events=state.events.filter(function(x){return x.id!==id2});closeModal();persist();return}
});
document.addEventListener('change',function(ev){
  var t=ev.target;if(!t)return;
  var fc=t.getAttribute&&t.getAttribute('data-flt');
  if(fc){if(t.checked)delete hidden[fc];else hidden[fc]=1;saveF();render();return}
  if(t.id==='f-host'){var cs=document.getElementById('f-country');if(cs)cs.innerHTML=countryOpts(t.value,cs.value);return}
  if(t.id==='f-cat'||(t.closest&&t.closest('#f-links'))){
    var cat=document.getElementById('f-cat').value;
    function linked(v){var x=document.querySelector('#f-links input[value="'+v+'"]');return x&&x.checked}
    var p=document.getElementById('f-p2p');if(p)p.style.display=(cat==='p2p'||cat==='capdev'||linked('p2p')||linked('capdev'))?'grid':'none';
    var a=document.getElementById('f-aslf');if(a)a.style.display=(cat==='aslf'||linked('aslf'))?'grid':'none';
  }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape')closeModal();
  if(ev.key==='Enter'&&document.getElementById('ov')&&document.getElementById('ov').classList.contains('on')&&ev.target.tagName==='INPUT'){ev.preventDefault();if(ev.target.id==='si-email')sendLink();else if(document.getElementById('f-save'))save()}
});

render();
sb.auth.onAuthStateChange(function(evt,session){if(evt==='SIGNED_IN'&&session){var key='aslpSignedIn:'+(session.user&&session.user.id);try{if(!sessionStorage.getItem(key)){sessionStorage.setItem(key,'1');sb.rpc('cal_record_signin').then(function(){},function(){})}}catch(e){}}if(evt==='SIGNED_IN'||evt==='SIGNED_OUT'||evt==='TOKEN_REFRESHED')refreshMe()});
refreshMe();
/* pick up other people's changes */
window.addEventListener('focus',function(){if(loaded&&!saving&&!document.getElementById('ov').classList.contains('on'))load(true)});
setInterval(function(){if(!document.hidden&&!saving&&!document.getElementById('ov').classList.contains('on'))load(true)},120000);
})();

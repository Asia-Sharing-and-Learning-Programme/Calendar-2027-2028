:root{--bg:#fafaf7;--ink:#1f2328;--muted:#6b7280;--line:#e4e2dc;--head:#f4f3ee;--wkend:#f1efe8}

body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{padding:14px 18px 28px;max-width:1700px;margin:0 auto}
header{display:flex;align-items:flex-start;gap:18px;flex-wrap:nowrap;margin-bottom:10px}

.brand{display:flex;flex-direction:column;align-items:center;flex:none}
.brand h1{font-size:15px;margin-top:4px;white-space:nowrap}
.logo{height:100px;width:auto;display:block;background:transparent}
.legend{display:flex;flex-direction:column;gap:6px;flex:1 1 600px;min-width:0;overflow-x:auto;padding-bottom:2px;font-size:12px;color:var(--muted)}

.status{font-size:12px;color:var(--muted)}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.hint{font-size:12px;color:var(--muted);margin:0 0 8px}
.grid{display:grid;grid-template-columns:30px 46px repeat(37,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:#fff;border-radius:6px;overflow:hidden}

.h.we{color:#a39a85}
.h.wk{font-size:11px;color:var(--ink);font-weight:650;border-right-color:#b9b5a8;background:#ebe9e2}

.c.we .d{color:#8c836f}
.ev{font-size:9.5px;line-height:12px;height:12px;color:#fff;padding:0 2px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:2px}

.more{font-size:9px;color:var(--muted);line-height:11px}
.list{margin-top:18px;max-width:900px}

.row{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.row:hover{background:#efede6}

.emptymsg{font-size:13px;color:var(--muted)}

.ov.on{display:flex}

.modal .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
.ex{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.ex .t{flex:1;min-width:0}

.lnk{background:none;border:none;color:#2563eb;cursor:pointer;font-size:12px;padding:2px 4px}

.nt{font-size:12px;color:#374151;white-space:pre-wrap;margin-top:3px;background:#f6f5f1;padding:4px 6px;border-radius:4px}

.lb-top{display:flex;justify-content:space-between;gap:8px;font-size:12px}

.lb-segs{display:flex;gap:4px;margin-top:7px}.lb-segs span{flex:1;height:9px;border-radius:3px;background:var(--line)}.lb-segs span.on{background:#005bbe}.lb-segs span.unk{background:rgba(0,91,190,.22)}.limitbox.full .lb-segs span{background:rgba(226,74,27,.25)}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}

.qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

.qsec{margin-top:8px}
.qsec-h{display:flex;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:3px}

.qrow{display:flex;align-items:center;gap:6px;font-size:13px;padding:2px 0}

.qsum{max-width:none}
.note2{font-size:12px;color:var(--muted);margin:0 0 10px}

function ink(h){var r=parseInt(h.substr(1,2),16),g=parseInt(h.substr(3,2),16),b=parseInt(h.substr(5,2),16);return (0.299*r+0.587*g+0.114*b)>165?'#111':'#fff'}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function toD(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function toK(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(k,n){var d=toD(k);d.setDate(d.getDate()+n);return toK(d)}
function daysBetween(a,b){return Math.round((toD(b)-toD(a))/86400000)}
function monthAdd(k,n){var d=toD(k),y=d.getFullYear(),m=d.getMonth()+n,last=new Date(y,m+1,0).getDate();return toK(new Date(y,m,Math.min(d.getDate(),last)))}
function nthWd(k,n){var d=toD(k),wd=d.getDay(),nth=Math.floor((d.getDate()-1)/7),y=d.getFullYear(),m=d.getMonth()+n;var first=new Date(y,m,1),day=1+((wd-first.getDay()+7)%7)+nth*7,last=new Date(y,m+1,0).getDate();while(day>last)day-=7;return toK(new Date(y,m,day))}
function occurrences(s,rep,until){var out=[],i=0,k=s;while(k<=until&&out.length<300){out.push(k);i++;if(rep==='w1')k=addDays(s,7*i);else if(rep==='w2')k=addDays(s,14*i);else if(rep==='m1')k=monthAdd(s,i);else if(rep==='m2')k=monthAdd(s,2*i);else if(rep==='m3')k=monthAdd(s,3*i);else if(rep==='m6')k=monthAdd(s,6*i);else if(rep==='y1')k=monthAdd(s,12*i);else if(rep==='mn')k=nthWd(s,i);else break}return out}

  if(t.id==='si-go'){sendLink();return}
  if(t.id==='si-code-go'){signInWithCode();return}
  if(t.id==='fin-go'){finishLink();return}
  if(t.id==='signoutbtn'){sb.auth.signOut().then(function(){me={email:'',can_view:false,can_edit:false,is_admin:false,group_names:[]};load()});return}
  if(t.id==='f-from-clear'){ev.preventDefault();Array.prototype.forEach.call(document.querySelectorAll('#f-from input:checked'),function(x){x.checked=false});var fo2=document.getElementById('f-from-other');if(fo2)fo2.value='';return}
  if(t.hasAttribute&&t.hasAttribute('data-fall')){hidden={};if(t.getAttribute('data-fall')==='0')for(var c in CATS)hidden[c]=1;saveF();render();return}
  var cell=t.closest&&t.closest('.c[data-k],.mc[data-k]');if(cell){openDay(cell.getAttribute('data-k'));return}
  var row=t.closest&&t.closest('[data-open]');if(row){openDay(row.getAttribute('data-open'));return}
  if(t.id==='ov'||t.id==='f-cancel'){closeModal();return}
  if(t.id==='f-save'){save();return}
  if(t.getAttribute('data-edit')){var id=t.getAttribute('data-edit');var e=state.events.filter(function(x){return x.id===id})[0];if(e){editId=id;drawModal(e)}return}
  if(t.getAttribute('data-delgrp')){var g=t.getAttribute('data-delgrp');state.events=state.events.filter(function(x){return x.grp!==g});closeModal();persist();return}
  if(t.getAttribute('data-del')){var id2=t.getAttribute('data-del');state.events=state.events.filter(function(x){return x.id!==id2});closeModal();persist();return}
});
document.addEventListener('change',function(ev){
  var t=ev.target;if(!t)return;
  var fc=t.getAttribute&&t.getAttribute('data-flt');
  if(fc){if(t.checked)delete hidden[fc];else hidden[fc]=1;saveF();render();return}
  if(t.id==='f-host'){var cs=document.getElementById('f-country');if(cs)cs.innerHTML=countryOpts(t.value,cs.value);return}
  if(((t.id==='f-kind'&&t.value==='online')||(t.id==='f-cat'&&isGroupCat(t.value)&&(document.getElementById('f-kind')||{}).value==='online'))&&!editId){var rp=document.getElementById('f-rep');if(rp&&!rp.value)rp.value='mn'}
  if(t.id==='f-cat'||t.id==='f-kind'||t.id==='f-act'||(t.closest&&t.closest('#f-links'))){
    kindSync();var cat=document.getElementById('f-cat').value;var av=((document.getElementById('f-kind')||{}).value==='activity'&&isGroupCat(cat))?(document.getElementById('f-act')||{}).value:'';
    function linked(v){var x=document.querySelector('#f-links input[value="'+v+'"]');return x&&x.checked}
    var p=document.getElementById('f-p2p');if(p)p.style.display=(cat==='p2p'||cat==='capdev'||av==='p2p'||av==='capdev'||linked('p2p')||linked('capdev'))?'grid':'none';
    var a=document.getElementById('f-aslf');if(a)a.style.display=(cat==='aslf'||av==='aslf'||linked('aslf'))?'grid':'none';
  }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape')closeModal();
  if(ev.key==='Enter'&&document.getElementById('ov')&&document.getElementById('ov').classList.contains('on')&&ev.target.tagName==='INPUT'){ev.preventDefault();if(ev.target.id==='si-email')sendLink();else if(ev.target.id==='si-code')signInWithCode();else if(document.getElementById('f-save'))save()}
});

render();
(function(){var q=new URLSearchParams(location.search),h=q.get('token_hash');if(!h)return;pendingHash=h;pendingType=q.get('type')||'email';
  history.replaceState(null,'',location.pathname+location.hash);
  document.getElementById('modal').innerHTML='<h3>Finish signing in</h3><div class="signin"><p>Click the button below to finish signing in on this device.</p></div><div class="err" id="fin-err"></div><div class="btns"><button class="b" id="f-cancel">Cancel</button><button class="b signin-btn" id="fin-go">Finish signing in</button></div>';
  document.getElementById('ov').classList.add('on');})();
sb.auth.onAuthStateChange(function(evt,session){if(evt==='SIGNED_IN'&&session){var key='aslpSignedIn:'+(session.user&&session.user.id);try{if(!sessionStorage.getItem(key)){sessionStorage.setItem(key,'1');sb.rpc('cal_record_signin').then(function(){},function(){})}}catch(e){}}if(evt==='SIGNED_IN'||evt==='SIGNED_OUT'||evt==='TOKEN_REFRESHED')refreshMe()});
refreshMe();
/* pick up other people's changes */
window.addEventListener('focus',function(){if(loaded&&!saving&&!document.getElementById('ov').classList.contains('on'))load(true)});
setInterval(function(){if(!document.hidden&&!saving&&!document.getElementById('ov').classList.contains('on'))load(true)},120000);
})();
</script></body></html>
